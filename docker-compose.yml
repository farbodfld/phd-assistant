services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: phd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: phd
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phd"]
      interval: 10s
      retries: 5

  app:
    build: .
    init: true
    shm_size: 512m
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://phd:${POSTGRES_PASSWORD:-change-me}@db:5432/phd}
      FINDAPHD_ARCHIVE_DIR: /data/findaphd
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - positions:/data/positions
      - findaphd:/data/findaphd
    command: ["phd", "serve"]

volumes:
  pgdata:
  positions:
  findaphd:
