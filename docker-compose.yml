services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: phd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: phd
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phd"]
      interval: 10s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - positions:/data/positions
    command: ["phd", "serve"]

volumes:
  pgdata:
  positions:
