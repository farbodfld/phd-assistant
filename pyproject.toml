[project]
name = "phd-assistant"
version = "0.1.0"
description = "Farbod's agentic PhD search assistant"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "openpyxl>=3.1",
    "anthropic>=0.40",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
phd = "app.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
